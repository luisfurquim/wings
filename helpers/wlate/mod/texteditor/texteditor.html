<div class="wl-panels">
   <div class="wl-panel wl-panel-left">
      <div class="wl-content-ro">{{left_content}}</div>
   </div>
   <div class="wl-panel wl-panel-right" id="wl-right-panel">
      <div class="wl-content-wrapper">
         <textarea class="wl-content-edit">{{right_content}}</textarea>
         <img class="wl-text-badge" &src="{{right_text_src}}"
              width="20" height="20" alt="" onerror="this.src=''" />
      </div>
      <div id="wl-revised-toggle" class="wl-revised-indicator"></div>
   </div>
</div>
