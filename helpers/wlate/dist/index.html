<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>wlate — Translation Editor</title>
   <script src="prana_helper.js" integrity="sha384-o3gZqoBO8Iye2pKQRe0l/bpldhdoVJSJ6IxuknmiPD3GwwIGqDXcX7HGNLXwmHTu" crossorigin="anonymous"></script>
   <script src="wasm_exec.js" integrity="sha384-PWCs+V4BDf9yY1yjkD/p+9xNEs4iEbuvq+HezAOJiY3XL5GI6VyJXMsvnjiwNbce" crossorigin="anonymous"></script>
   <script>
      const go = new Go();
      WebAssembly
         .instantiateStreaming(fetch("wings.wasm"), go.importObject)
         .then(r => go.run(r.instance))
         .catch(console.error);
   </script>
   <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
         height: 100%;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #F7F5F3;
         color: #1a1a2e;
      }
   </style>
</head>
<body>
   <wp-wlate></wp-wlate>
</body>
</html>
