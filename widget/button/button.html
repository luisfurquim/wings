<button part="root" class="btn-root">
  <span part="prefix" class="btn-prefix"><slot name="prefix"></slot></span>
  <span part="label"  class="btn-label"><slot></slot></span>
  <span part="suffix" class="btn-suffix"><slot name="suffix"></slot></span>
  <span part="spinner" class="btn-spinner" ?loading></span>
</button>
