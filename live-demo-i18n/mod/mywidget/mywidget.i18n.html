<html><head></head><body><div class="widget">
   <h1>0</h1>

   <!-- Navigation -->
   <nav>
      <a id="nav-list" href="#list">1</a>
      <a id="nav-dash" href="#dashboard">2</a>
   </nav>

   <!-- Toolbar -->
   <div class="toolbar">
      <button id="btn-toggle-mode">3</button>
      <button id="btn-toggle-extra">4</button>
      <span class="mode-badge">5<strong>6</strong></span>
   </div>

   <!-- Page 1: List -->
   <div ?#="list" class="page page-list">
      <h2>7</h2>
      <p>8<span class="counter">9</span></p>

      <!-- Boolean conditional -->
      <div ?show_extra="" class="extra-box">
         <p>10</p>
      </div>

      <!-- Negated boolean conditional -->
      <div ?!show_extra="" class="extra-hint">
         <p>11</p>
      </div>

      <!-- Equality conditional: only in edit mode -->
      <div ?mode="edit">
         <form>
            <input &value="{{input_val}}" type="text" placeholder="12"/>
            <input type="submit" value="Add"/>
         </form>
      </div>

      <!-- Inequality conditional: hidden when readonly -->
      <div ?mode!="readonly" class="edit-hint">
         <p>13</p>
      </div>

      <!-- Prefix conditional -->
      <div ?mode^="ed" class="cond-demo">
         <p>14</p>
      </div>

      <!-- Suffix conditional -->
      <div ?mode$="it" class="cond-demo">
         <p>15</p>
      </div>

      <!-- Contains conditional -->
      <div ?mode*="d" class="cond-demo">
         <p>16</p>
      </div>

      <ul>
         <li *items:i="">17</li>
      </ul>
   </div>

   <!-- Page 2: Dashboard -->
   <div ?#="dashboard" class="page page-dash">
      <h2>2</h2>
      <p>18<span class="counter counter-lg">19</span></p>

      <div class="dash-grid">
         <div class="dash-card">
            <h3>20</h3>
            <ul>
               <li *items:i="">17</li>
            </ul>
         </div>
         <div class="dash-card">
            <h3>21</h3>
            <p>5<strong>6</strong></p>
            <p>22<strong>23</strong></p>
            <p>24<strong>9</strong></p>
         </div>
      </div>

      <!-- Boolean conditional on dashboard too -->
      <div ?show_extra="" class="extra-box">
         <p>10</p>
      </div>
   </div>
</div>
</body></html>
