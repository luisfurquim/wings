<html><head></head><body><div class="wl-root">

   <!-- Status bar -->
   <div class="wl-status">
      <span class="wl-pending">0<strong>1</strong>2</span>
      <div class="wl-tabs">
         <button id="tab-text" class="wl-tab wl-tab-active">3</button>
         <button id="tab-inflection" class="wl-tab">4</button>
      </div>
   </div>

   <!-- Language selectors -->
   <div class="wl-lang-bar">
      <div class="wl-lang-left">
         <wp-combobox id="cb-left" options="{{lang_options}}" placeholder="5" @change="on_left_lang"></wp-combobox>
      </div>
      <div class="wl-lang-right">
         <wp-combobox id="cb-right" options="{{lang_options}}" placeholder="6" @change="on_right_lang"></wp-combobox>
      </div>
   </div>

   <!-- Context info -->
   <div class="wl-context-bar">
      <div class="wl-ctx-left">
         <span class="wl-ctx-file">7</span>
         <span class="wl-ctx-detail">8</span>
      </div>
      <div class="wl-ctx-right">
         <span class="wl-ctx-file">7</span>
         <span class="wl-ctx-detail">8</span>
      </div>
   </div>

   <!-- TEXT TAB -->
   <div ?tab="text" class="wl-panels">
      <div class="wl-panel wl-panel-left">
         <div class="wl-content-ro">9</div>
      </div>
      <div class="wl-panel wl-panel-right" id="wl-right-panel">
         <textarea class="wl-content-edit">10</textarea>
         <div id="wl-revised-toggle" class="wl-revised-indicator"></div>
      </div>
   </div>

   <!-- INFLECTION TAB -->
   <div ?tab="inflection" class="wl-panels">
      <div class="wl-panel wl-panel-left">
         <div class="wl-expr">11</div>
         <div class="wl-grid" id="wl-grid-left" role="grid">
            <div class="wl-grid-corner" role="columnheader"></div>
            <div class="wl-grid-col-header" role="columnheader" *gender_headers:gi="" aria-label="12">13</div>
            <div class="wl-grid-rows" **category_headers:ci="">
               <div class="wl-grid-row" role="row">
                  <div class="wl-grid-row-header" role="rowheader" aria-label="14">15</div>
                  <div class="wl-grid-cell" role="gridcell" *gender_headers:gi="">16</div>
               </div>
            </div>
         </div>
      </div>
      <div class="wl-panel wl-panel-right" id="wl-right-inflection-panel">
         <div class="wl-expr">11</div>
         <div class="wl-grid" id="wl-grid-right" role="grid">
            <div class="wl-grid-corner" role="columnheader"></div>
            <div class="wl-grid-col-header" role="columnheader" *gender_headers:gi="" aria-label="12">13</div>
            <div class="wl-grid-rows" **category_headers:ci="">
               <div class="wl-grid-row" role="row">
                  <div class="wl-grid-row-header" role="rowheader" aria-label="14">15</div>
                  <div class="wl-grid-cell-edit" role="gridcell" *gender_headers:gi="">
                     <input class="wl-cell-input" type="text" data-ci="{{ci}}" data-gi="{{gi}}" aria-label="17" &value="{{right_cells[ci].cols[gi]}}"/>
                  </div>
               </div>
            </div>
         </div>
         <div id="wl-revised-toggle-inflection" class="wl-revised-indicator"></div>
      </div>
   </div>

   <!-- Navigation -->
   <div class="wl-nav">
      <label class="wl-filter-toggle" id="wl-filter-toggle">
         <span class="wl-toggle-track" id="wl-toggle-track"><span class="wl-toggle-thumb"></span></span>18</label>
      <div class="wl-nav-buttons">
         <button id="nav-first" class="wl-nav-btn" title="19">20</button>
         <button id="nav-prev10" class="wl-nav-btn" title="21">22</button>
         <button id="nav-prev" class="wl-nav-btn" title="23">24</button>
         <input id="nav-input" class="wl-nav-input" type="text" &value="{{nav_input}}"/>
         <span class="wl-record-info">25</span>
         <button id="nav-next" class="wl-nav-btn" title="26">27</button>
         <button id="nav-next10" class="wl-nav-btn" title="28">29</button>
         <button id="nav-last" class="wl-nav-btn" title="30">31</button>
      </div>
      <button id="btn-save" class="wl-save-btn" title="32">33</button>
   </div>

   <!-- Unsaved changes dialog -->
   <div ?show_dialog="" class="wl-overlay">
      <div class="wl-dialog">
         <p>34</p>
         <div class="wl-dialog-btns">
            <button id="dlg-save">35</button>
            <button id="dlg-discard">36</button>
            <button id="dlg-cancel">37</button>
         </div>
      </div>
   </div>

</div>
</body></html>
