<div class="wl-panels" data-mode="{{flex_mode}}">
   <div class="wl-panel wl-panel-left">
      <div class="wl-expr wl-cells-only">{{inflection_expr}}</div>
      <div class="wl-grid wl-cells-only" id="wl-grid-left" role="grid">
         <div class="wl-grid-corner" role="columnheader"></div>
         <div class="wl-grid-col-header" role="columnheader"
              *gender_headers:gi
              aria-label="{{gender_headers[gi].aria}}">{{gender_headers[gi].label}}</div>
         <div class="wl-grid-rows" **category_headers:ci>
            <div class="wl-grid-row" role="row">
               <div class="wl-grid-row-header" role="rowheader"
                    aria-label="{{category_headers[ci].aria}}">{{category_headers[ci].label}}</div>
               <div class="wl-grid-cell" role="gridcell"
                    *gender_headers:gi>{{left_cells[ci].cols[gi]}}</div>
            </div>
         </div>
      </div>
      <div class="wl-phrase-ro wl-content-only">{{left_content}}</div>
   </div>
   <div class="wl-panel wl-panel-right" id="wl-right-inflection-panel">
      <div class="wl-expr wl-cells-only">{{inflection_expr}}</div>
      <div class="wl-grid wl-cells-only" id="wl-grid-right" role="grid">
         <div class="wl-grid-corner" role="columnheader"></div>
         <div class="wl-grid-col-header" role="columnheader"
              *gender_headers:gi
              aria-label="{{gender_headers[gi].aria}}">{{gender_headers[gi].label}}</div>
         <div class="wl-grid-rows" **category_headers:ci>
            <div class="wl-grid-row" role="row">
               <div class="wl-grid-row-header" role="rowheader"
                    aria-label="{{category_headers[ci].aria}}">{{category_headers[ci].label}}</div>
               <div class="wl-grid-cell-edit" role="gridcell"
                    *gender_headers:gi>
                  <div class="wl-cell-wrapper">
                     <input class="wl-cell-input" type="text"
                            data-ci="{{ci}}" data-gi="{{gi}}"
                            aria-label="{{category_headers[ci].aria}}, {{gender_headers[gi].aria}}"
                            &value="{{right_cells[ci].cols[gi]}}" />
                     <img class="wl-cell-badge"
                          &src="{{right_srcs[ci].cols[gi]}}"
                          width="16" height="16" alt="" onerror="this.src=''" />
                  </div>
               </div>
            </div>
         </div>
      </div>
      <div class="wl-phrase-toolbar wl-content-only">
         <button type="button" id="wl-copy-to-right" class="wl-copy-btn"
                 title="Copiar a frase de referência"
                 aria-label="Copiar a frase de referência para a tradução"><span translate="no">→</span></button>
      </div>
      <textarea class="wl-phrase-edit wl-content-only">{{right_content}}</textarea>
      <div id="wl-revised-toggle-inflection" class="wl-revised-indicator"></div>
   </div>
   <w-dialog ?confirm_overwrite buttons="overwrite,cancel"
             title="Sobrescrever tradução?"
             @overwrite="dlg_overwrite" @cancel="dlg_cancel">A tradução já tem conteúdo. Substituir pela frase de referência?</w-dialog>
</div>
