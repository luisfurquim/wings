<html><head></head><body><div class="shell">
  <header>
    <h1>0</h1>
    <locale-switcher @error="fnLocaleError"></locale-switcher>
    <skin-switcher></skin-switcher>
  </header>

  <main>
    <!-- Dogfooding: the shell navigation uses wings's own w-tabs in accordion
         mode (each w-tabbutton is moved into its w-tab to become the native
         <summary>) instead of raw <details>/<summary>. -->
    <w-tabs mode="accordion">
      <w-tabbutton>1</w-tabbutton>
      <w-tab active=""><basics-tab></basics-tab></w-tab>

      <w-tabbutton>2</w-tabbutton>
      <w-tab><flex-tab></flex-tab></w-tab>

      <w-tabbutton>3</w-tabbutton>
      <w-tab><fmt-tab></fmt-tab></w-tab>

      <w-tabbutton>4</w-tabbutton>
      <w-tab><i18n-tab></i18n-tab></w-tab>

      <w-tabbutton>5</w-tabbutton>
      <w-tab><measures-tab></measures-tab></w-tab>

      <w-tabbutton>6</w-tabbutton>
      <w-tab><tabs-demo></tabs-demo></w-tab>

      <w-tabbutton>7</w-tabbutton>
      <w-tab><wtest-tab></wtest-tab></w-tab>
    </w-tabs>
  </main>

  <!-- Locale load failures surface here: the locale-switcher fires @error and
       the handler branches on the typed wi18n.CatalogSignatureError. -->
  <w-dialog ?show_locale_error="" buttons="cancel" @cancel="fnLocaleErrorClose">
    <span ?locale_error_sig="">8</span>
    <span ?locale_error_other="">9</span>
  </w-dialog>
</div>
</body></html>
