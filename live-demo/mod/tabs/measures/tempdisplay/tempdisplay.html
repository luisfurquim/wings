<div class="temp-display">
  <table>
    <tbody><tr><td>padrão (locale):</td><td><strong>{{%temp}}</strong></td></tr>
    <tr><td>:c (Celsius):</td><td><strong>{{%temp:c}}</strong></td></tr>
    <tr><td>:f (Fahrenheit):</td><td><strong>{{%temp:f}}</strong></td></tr>
    <tr><td>:k (Kelvin):</td><td><strong>{{%temp:k}}</strong></td></tr>
  </tbody></table>
</div>
