<html><head></head><body><w-tabs class="wl-root" mode="detached" active="{{tab}}">

   <!-- Status bar -->
   <div class="wl-status">
      <span class="wl-pending">1<strong>{{pending_count}}</strong>2</span>
      <div class="wl-tabs">
         <button type="button" class="wl-tab" id="wl-tab-text" data-tab="text">3</button>
         <button type="button" class="wl-tab" id="wl-tab-inflection" data-tab="inflection">4</button>
      </div>
      <skin-switcher></skin-switcher>
   </div>

   <!-- Language selectors -->
   <div class="wl-lang-bar">
      <div class="wl-lang-left">
         <w-combobox id="cb-left" mode="single" options="{{lang_options}}" value="{{left_lang}}" placeholder="5" @change="on_left_lang"></w-combobox>
      </div>
      <div class="wl-lang-right">
         <w-combobox id="cb-right" mode="single" options="{{lang_options}}" value="{{right_lang}}" placeholder="6" @change="on_right_lang"></w-combobox>
      </div>
   </div>

   <!-- Context info -->
   <div class="wl-context-bar">
      <div class="wl-ctx-left">
         <span class="wl-ctx-file">{{context}}</span>
         <span class="wl-ctx-detail">{{ctxdetail_text}}</span>
      </div>
      <div class="wl-ctx-right">
         <span class="wl-ctx-file">{{context}}</span>
         <span class="wl-ctx-detail">{{ctxdetail_text}}</span>
      </div>
   </div>

   <!-- TEXT TAB — panes + edit logic live in the wl-text-editor module.
        @register hands the editor to the shell; @revised/@input bubble the
        border-click and keystroke intents back up to the session. -->
   <w-tab tid="text">
      <wl-text-editor @register="registerEditor" @revised="toggleRevised" @input="markDirty"></wl-text-editor>
   </w-tab>

   <!-- INFLECTION TAB — grids + edit logic live in the wl-flex-editor module. -->
   <w-tab tid="inflection">
      <wl-flex-editor @register="registerEditor" @revised="toggleRevised"></wl-flex-editor>
   </w-tab>

   <!-- Navigation -->
   <div class="wl-nav">
      <label class="wl-filter-toggle" id="wl-filter-toggle">
         <span class="wl-toggle-track" id="wl-toggle-track"><span class="wl-toggle-thumb"></span></span>7</label>
      <w-navbar nav_input="{{nav_input}}" total_count="{{total_count}}" @first="navFirst" @prevmany="navPrev10" @prev="navPrev" @next="navNext" @nextmany="navNext10" @last="navLast" @change="navJump">
      </w-navbar>
      <button id="btn-save" class="wl-save-btn" title="8">9</button>
   </div>

   <!-- Unsaved changes dialog -->
   <w-dialog ?show_dialog="" buttons="save,discard,cancel" @save="fnSave" @discard="fnDiscard" @cancel="fnCancel">10</w-dialog>

</w-tabs>
</body></html>
