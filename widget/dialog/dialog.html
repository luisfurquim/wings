<div class="w-dialog-overlay">
   <div class="w-dialog">
      <div class="w-dialog-header" ?title>
         <h2 class="w-dialog-title">{{title}}</h2>
      </div>
      <div class="w-dialog-content">
         <slot></slot>
      </div>
      <div class="w-dialog-buttons">
         <button id="dlg-save" data-i18n="dlg_btn_save" ?btn_save_show style="order:{{btnSaveOrder}};">Salvar</button>
         <button id="dlg-discard" data-i18n="dlg_btn_discard" ?btn_discard_show style="order:{{btnDiscardOrder}};">Descartar</button>
         <button id="dlg-overwrite" data-i18n="dlg_btn_overwrite" ?btn_overwrite_show style="order:{{btnOverwriteOrder}};">Sobrescrever</button>
         <button id="dlg-cancel" data-i18n="dlg_btn_cancel" ?btn_cancel_show style="order:{{btnCancelOrder}};">Cancelar</button>
      </div>
   </div>
</div>
