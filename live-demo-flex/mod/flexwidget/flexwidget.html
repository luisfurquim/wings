<div class="flex-demo">
   <h1>Demonstração de flexão</h1>

   <div class="controls">
      <label>
         Gênero:
         <select id="sel-genero">
            <option value="m">Masculino</option>
            <option value="f">Feminino</option>
         </select>
      </label>
      <label>
         Quantidade:
         <input id="inp-qt" type="number" min="0" value="{{qt}}" />
      </label>
   </div>

   <p class="result">
      {{@genero ~o %qt ~aluno do terceiro ano que ~está ~aprovado ~ganhou uma bolsa de estudos}}
   </p>
</div>
