<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8" />
   <title>wings live demo</title>
   <script src="prana_helper.js" integrity="sha384-o3gZqoBO8Iye2pKQRe0l/bpldhdoVJSJ6IxuknmiPD3GwwIGqDXcX7HGNLXwmHTu" crossorigin="anonymous"></script>
   <script src="wasm_exec.js" integrity="sha384-PWCs+V4BDf9yY1yjkD/p+9xNEs4iEbuvq+HezAOJiY3XL5GI6VyJXMsvnjiwNbce" crossorigin="anonymous"></script>
   <script>
      if (!location.hash) location.hash = '#list';
      // IIFE keeps `go` off window — prevents same-origin scripts from reading
      // WASM linear memory via go.mem.buffer. See README.md §Security.
      (async () => {
         const go = new Go();
         const r = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
         go.run(r.instance);
      })().catch(console.error);
   </script>
</head>
<body>
   <my-widget title="wings live demo"></my-widget>
</body>
</html>
