<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8" />
   <title>wprana live demo</title>
   <script src="prana_helper.js"></script>
   <script src="wasm_exec.js"></script>
   <script>
      if (!location.hash) location.hash = '#list';
      // IIFE keeps `go` off window — prevents same-origin scripts from reading
      // WASM linear memory via go.mem.buffer. See README.md §Security.
      (async () => {
         const go = new Go();
         const r = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
         go.run(r.instance);
      })().catch(console.error);
   </script>
</head>
<body>
   <my-widget title="wprana live demo"></my-widget>
</body>
</html>
